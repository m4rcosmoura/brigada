<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brigada Checklist</title>
<link rel="icon" type="image/png" href="brigada.png">
<link rel="apple-touch-icon" href="brigada.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  /* Específico do app de celular. Textos de botão nunca quebram linha: cortam com "…" */
  .btn, .item .opc button { white-space: nowrap; }
  .corta { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Tela inicial: ocupa exatamente a altura da tela, sem rolagem */
  body.tela-inicio { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body.tela-inicio main { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .inicio { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .inicio > * { margin: 0; flex: none; }
  .inicio .hero { padding: 14px 16px; }
  .hero-topo { display: flex; align-items: center; gap: 12px; }
  .hero-txt { flex: 1; min-width: 0; }
  .hero-txt .nome { font-size: 1.1rem; font-weight: 800; }
  .hero-rodape { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .85rem; }
  .hero-rodape .corta { flex: 1; }
  .hero-rodape .btn { flex: none; width: auto; margin: 0; min-height: 38px; padding: 6px 12px; font-size: .85rem; }
  .inicio .btn-scan { flex: 1 1 auto; min-height: 96px; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
  .inicio .btn-scan .ic { width: clamp(44px, 12vh, 76px); height: clamp(44px, 12vh, 76px); }
  .inicio .btn-scan b { font-size: 1.55rem; }
  @media (max-height: 700px) {                                /* celulares baixos: tudo cabe sem rolagem */
    .inicio { gap: 10px; }
    .inicio .btn-scan { padding: 10px; gap: 4px; }
    .inicio .btn-scan .ic { width: 40px; height: 40px; }
    .inicio .btn-scan small { display: none; }
    .inicio .btn-meus { min-height: 54px; }
  }
  .cats { display: flex; gap: 10px; }
  .cats .cat { flex: 1 1 0; }
  .cats.tres { gap: 8px; }                                   /* 3 categorias: cartões compactos, sempre numa linha */
  .cats.tres .cat { padding: 8px 6px; gap: 4px; flex-direction: column; text-align: center; }
  .cats.tres .ilus { --t: 34px !important; }
  .cats.tres .cat .info { width: 100%; }
  .cats.tres .cat .info b { font-size: 1rem; }
  .cat { color: inherit; text-decoration: none; background: #fff; border: 1px solid var(--line); border-radius: var(--raio); box-shadow: var(--sombra); padding: 10px 12px;
    display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cat .info { flex: 1; min-width: 0; }
  .cat .info span { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat .info b { display: block; font-size: 1.15rem; font-weight: 800; line-height: 1.15; }
  .cat .barra { height: 5px; margin-top: 5px; }
  .destaque { position: relative; display: inline-block; margin-bottom: 12px; }
  .destaque .selo { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; color: #fff;
    border: 3px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--sombra); }
  .destaque .selo .ic { width: 18px; height: 18px; }
  .item p .ilus { margin-top: -2px; }

  .btn-scan { min-height: 120px; justify-content: flex-start; gap: 16px; padding: 18px 20px; text-align: left; position: relative; overflow: hidden; }
  .btn-scan .ic { width: 52px; height: 52px; }
  .btn-scan > span { min-width: 0; }
  .btn-scan b { display: block; font-size: 1.4rem; font-weight: 800; }
  .btn-scan small { display: block; font-weight: 500; opacity: .85; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; }
  .btn-scan::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.08); }
  .btn-meus { min-height: 64px; justify-content: flex-start; text-align: left; }
  .btn-meus .tag { margin-left: auto; flex: none; }
  .btn-meus > .corta { flex: 1; text-align: left; }
  .nomes .btn { justify-content: flex-start; text-align: left; min-height: 56px; font-size: .95rem; margin-bottom: 8px; font-weight: 600; }
  .nomes .btn small { margin-left: auto; font-weight: 500; color: var(--muted); flex: none; }

  /* Checklist compacto */
  .ativo-card { padding: 14px 16px; }
  .ativo-card .topo-eq { display: flex; gap: 12px; align-items: center; }
  .ativo-card .topo-eq .chip { width: 44px; height: 44px; border-radius: 12px; background: var(--red); color: #fff; }
  .ativo-card .topo-eq .chip .ic { width: 24px; height: 24px; }
  .ativo-card .cod { font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
  .ativo-card .fatos { margin-top: 10px; font-size: .85rem; display: grid; gap: 4px; }
  .ativo-card .fatos div { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .ativo-card .fatos .ic { width: 15px; height: 15px; color: #a7adb8; }
  .item { border: 1px solid var(--line); border-radius: var(--raio); padding: 11px 12px; margin-bottom: 8px; background: #fff; box-shadow: var(--sombra); }
  .item.ok { border-color: var(--green); box-shadow: inset 4px 0 0 var(--green), var(--sombra); }
  .item.nc { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red), var(--sombra); background: #fffafa; }
  .item p { margin: 0 0 9px; font-weight: 600; font-size: .93rem; display: flex; gap: 8px; }
  .item p .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item.na { border-color: #9aa3af; box-shadow: inset 4px 0 0 #9aa3af, var(--sombra); background: #fafafa; }
  .item .opc { display: grid; grid-template-columns: 1fr 1.3fr .62fr; gap: 6px; }
  .item .opc button { min-height: 48px; font: inherit; font-size: .88rem; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--line); background: #f8f9fb; color: var(--txt); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; }
  .item.ok .opc .b-ok { background: var(--green); border-color: var(--green); color: #fff; }
  .item.nc .opc .b-nc { background: var(--red); border-color: var(--red); color: #fff; }
  .item.na .opc .b-na { background: #6b7280; border-color: #6b7280; color: #fff; }
  .item .obs-item { margin-top: 8px; min-height: 42px; padding: 9px 12px; font-size: .9rem; }
  .extras { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .extras > div { display: flex; align-items: center; gap: 10px; }
  .extras > div label { flex: 1; margin: 0; }
  .extras > div input { flex: 0 0 165px; }
  .extras > div, .extras input { min-width: 0; }
  .extras input { padding: 8px; min-height: 44px; font-size: .9rem; }
  .extras label { font-weight: 600; font-size: .88rem; display: block; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok-msg { text-align: center; padding: 34px 18px; }
  .ok-msg .chip { width: 76px; height: 76px; border-radius: 50%; margin-bottom: 10px; }
  .ok-msg .chip .ic { width: 40px; height: 40px; }
  .scan-box { background: var(--ink); border-radius: 18px; padding: 18px; color: #fff; text-align: center; }
  .scan-box h2 { margin: 0; }
  .scan-frame { position: relative; margin: 16px auto 8px; max-width: 420px; }
  #leitor { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 280px; }
  #leitor video { object-fit: cover; }
  .scan-frame .c { position: absolute; width: 38px; height: 38px; border: 4px solid #fff; z-index: 2; pointer-events: none; }
  .scan-frame .c1 { top: -6px; left: -6px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .scan-frame .c2 { top: -6px; right: -6px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .scan-frame .c3 { bottom: -6px; left: -6px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .scan-frame .c4 { bottom: -6px; right: -6px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  @media (max-width: 420px) { .marca small { display: none; } }
</style>
</head>
<body>
<header class="topo">
  <button class="ibtn" id="btn-voltar" aria-label="Voltar" onclick="voltar()" hidden></button>
  <a class="marca" href="#/">
    <img class="escudo" src="brigada.png" alt="Brigada de Emergência">
    <span style="min-width:0"><b id="titulo">Brigada</b><small>Checklist de equipamentos</small></span>
  </a>
  <img class="logo" src="logo.png" alt="Dois Marcos Sementes" onerror="this.hidden=true">
  <button class="ibtn" id="btn-sync" onclick="sincronizar(true)" aria-label="Atualizar dados"></button>
</header>
<div id="banner"></div>
<main id="app"><div class="carregando">Carregando…</div></main>

<script src="dados-iniciais.js"></script>
<script src="comum.js"></script>
<script>
/* =================== APP DA BRIGADA (celular) =================== */
let leitorQR = null;
let destinoPosLogin = '';   // rota pedida antes de escolher o nome (ex.: link do QR)
const usuario = () => lsGet(LS.usuario, null);
/* dupla atual do brigadista (lida do cadastro, para refletir trocas feitas na gestão) */
function minhaDupla() { const u = usuario(); const b = u && S.brigadistas.find(x => x.Nome === u.Nome); return String(b ? b.Dupla || '' : (u && u.Dupla) || ''); }

/* Leitura do QR: o checklist só abre com o código secreto lido na etiqueta.
   O código fica só na memória (some do endereço) e vale por 30 minutos. */
const VALIDADE_LEITURA_MIN = 30;
let leitura = null; // { cod, token, em }
function leituraValida(cod) {
  return leitura && leitura.cod.toUpperCase() === String(cod).toUpperCase() && Date.now() - leitura.em < VALIDADE_LEITURA_MIN * 60000;
}

const ROTAS = { '': telaInicio, 'quem': telaQuem, 'ler': telaLer, 'eq': telaChecklist, 'meus': telaMeus };

function rota() {
  pararLeitor();
  let partes = location.hash.replace(/^#\/?/, '').split('/');
  // link vindo do QR: #/eq/CODIGO/TOKEN → guarda o token e tira do endereço
  if (partes[0] === 'eq' && partes[2]) {
    leitura = { cod: decodeURIComponent(partes[1]), token: decodeURIComponent(partes[2]), em: Date.now() };
    history.replaceState(null, '', '#/eq/' + partes[1]);
    partes = partes.slice(0, 2);
  }
  const nome = ROTAS[partes[0]] ? partes[0] : '';
  const arg = decodeURIComponent(partes.slice(1).join('/'));
  if (!usuario() && nome !== 'quem') {
    destinoPosLogin = location.hash.replace(/^#\/?/, '');
    return telaQuem();
  }
  document.getElementById('btn-voltar').hidden = nome === '';
  ROTAS[nome](arg);
  window.scrollTo(0, 0);
}
function render(titulo, html) {
  document.body.classList.remove('tela-inicio');
  document.getElementById('titulo').textContent = titulo;
  document.getElementById('app').innerHTML = html;
}

async function sincronizar(manual) {
  const b = document.getElementById('btn-sync');
  b.disabled = true;
  await enviarFila();
  await carregar();
  b.disabled = false;
  atualizarBanner();
  rota();
  if (manual) toast(S.offline ? 'Sem internet — usando dados salvos' : 'Dados atualizados');
}

/* ---------- Login: escolher o nome ---------- */
function telaQuem() {
  document.getElementById('btn-voltar').hidden = !usuario();
  const lista = S.brigadistas.filter(ativo).sort((a, b) => a.Nome.localeCompare(b.Nome));
  render('Brigada', `
    <div class="card escuro">
      <div class="linha" style="justify-content:space-between;flex-wrap:nowrap;margin-bottom:6px"><h2 style="margin:0">Quem é você?</h2><span style="display:flex;gap:6px">${ilusCat("Extintor", 40)}${ilus({ Categoria: "Hidrante", Tipo: "Hidrante com abrigo" }, 40)}${ilusCat("Hidrante", 40)}</span></div>
      <p class="muted" style="margin-top:0">Toque no seu nome. O app vai lembrar neste celular.</p>
      <input id="busca-nome" type="search" placeholder="Digite parte do nome…" oninput="filtrarNomes(this.value)" autocomplete="off">
    </div>
    <div class="nomes" id="nomes">
      ${lista.map(b => `<button type="button" class="btn sec" data-n="${esc(semAcento(b.Nome))}" onclick="escolherUsuario(${S.brigadistas.indexOf(b)})">
        <span class="corta">${esc(b.Nome)}</span> <small>${b.Dupla ? 'Dupla ' + esc(b.Dupla) : esc(b.Setor)}</small></button>`).join('')}
      ${lista.length ? '' : `<div class="card"><b>Nenhum brigadista carregado.</b><p class="muted">Verifique a internet e toque em atualizar no topo. Se continuar, avise o coordenador.</p></div>`}
    </div>`);
}
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function filtrarNomes(q) {
  q = semAcento(q).trim();
  document.querySelectorAll('#nomes .btn').forEach(b => b.hidden = q && !b.dataset.n.includes(q));
}
function escolherUsuario(i) {
  const b = S.brigadistas[i];
  lsSet(LS.usuario, { Nome: b.Nome, Dupla: String(b.Dupla || '') });
  const destino = destinoPosLogin && destinoPosLogin !== 'quem' ? destinoPosLogin : '';
  destinoPosLogin = '';
  ir(destino);
  toast('Olá, ' + primeiroNome(b.Nome) + '!');
}
function sair() { lsSet(LS.usuario, null); ir('quem'); }

/* ---------- Início ---------- */
function telaInicio() {
  const u = usuario();
  const meus = equipamentos().filter(e => minhaDupla() && duplaDe(e) === minhaDupla());
  const r = resumo(meus, mesAtual());
  const parceiro = membrosDupla(minhaDupla()).filter(b => b.Nome !== u.Nome).map(b => primeiroNome(b.Nome)).join(', ');
  render('Brigada', `
    <div class="inicio">
      <div class="card escuro hero">
        <div class="hero-topo">
          <div class="hero-txt">
            <div class="muted">Olá,</div>
            <b class="nome corta">${esc(u.Nome)}</b>
            <span class="muted corta">${minhaDupla() ? 'Dupla ' + esc(minhaDupla()) + (parceiro ? ' · com ' + esc(parceiro) : '') : 'Sem dupla definida'}</span>
          </div>
          ${meus.length ? donut([{ v: r.ok, cor: COR.ok }, { v: r.nc, cor: COR.nc }], r.pct + '%', 'feito', 84, 'rgba(255,255,255,.14)') : ''}
        </div>
        <div class="hero-rodape">
          <span class="corta">${meus.length ? `<b>${MESES[+mesAtual().split('-')[1] - 1]}</b> · ${r.feitos}/${r.total} · ${r.pend ? `<span style="color:#f5b94a">faltam ${r.pend}</span>` : '<span style="color:#5fd39f">tudo feito ✔</span>'}` : 'Nenhum equipamento na sua dupla'}</span>
          <button class="btn escuro" onclick="sair()">${ico('sair')} Não sou eu</button>
        </div>
      </div>
      ${meus.length ? `<div class="cats ${new Set(meus.map(e => e.Categoria)).size > 2 ? 'tres' : ''}">${[...new Set(meus.map(e => e.Categoria))].sort().map(c => { const rc = resumo(meus.filter(e => e.Categoria === c), mesAtual());
        return `<a class="cat" href="#/meus">${ilusCat(c, 44)}<div class="info"><span>${{ Extintor: 'Extintores', Hidrante: 'Hidrantes', Alarme: 'Alarmes' }[c] || esc(c)}</span><b>${rc.feitos}/${rc.total}</b>
          <div class="barra"><i style="width:${rc.pct}%"></i></div></div></a>`; }).join('')}</div>` : ''}
      <button class="btn btn-scan" onclick="ir('ler')">${ico('scan')}<span><b>Ler QR Code</b><small>Aponte para a etiqueta</small></span></button>
      <button class="btn sec btn-meus" onclick="ir('meus')"><span class="chip ambar">${ico('lista')}</span><span class="corta">Meus equipamentos</span>${r.pend ? `<span class="tag pend">${r.pend}</span>` : ''}</button>
    </div>`);
  document.body.classList.add('tela-inicio');
}

/* ---------- Leitor de QR ---------- */
function telaLer() {
  render('Ler QR Code', `
    <div class="scan-box">
      <h2>Escanear equipamento</h2>
      <div class="muted" style="color:#a7adb8">QR Code na etiqueta do extintor ou hidrante</div>
      <div class="scan-frame"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><div id="leitor"></div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="muted" style="margin:0">O checklist só abre lendo o QR Code no local. Etiqueta danificada ou ilegível? <b>Avise o coordenador</b> para imprimir outra.</p>
    </div>`);
  iniciarLeitor();
}
/* Texto lido no QR → { cod, token }. Etiquetas antigas (sem token) não valem. */
function lerQR(txt) {
  const m = String(txt).match(/#\/eq\/([^/?&#\s]+)\/([^/?&#\s]+)/);
  if (!m) return toast('Este QR Code não é uma etiqueta válida da brigada.');
  const cod = decodeURIComponent(m[1]);
  const eq = eqPorCodigo(cod);
  if (!eq) return toast('Equipamento não encontrado: ' + cod);
  leitura = { cod: eq.Codigo, token: decodeURIComponent(m[2]), em: Date.now() };
  ir('eq/' + encodeURIComponent(eq.Codigo));
}
function msgLeitor(txt) { const el = document.getElementById('leitor'); if (el) el.innerHTML = `<p style="color:#fff;padding:40px 20px">${txt}</p>`; }
async function iniciarLeitor() {
  if (!window.Html5Qrcode) {
    try { await carregarScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'); }
    catch (e) { return msgLeitor('Não foi possível carregar o leitor. Use a câmera do próprio celular para ler o QR Code.'); }
  }
  if (!document.getElementById('leitor') || leitorQR) return;
  leitorQR = new Html5Qrcode('leitor');
  leitorQR.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } },
    txt => { pararLeitor(); if (navigator.vibrate) navigator.vibrate(120); lerQR(txt); },
    () => {}
  ).catch(() => msgLeitor('Sem acesso à câmera. Permita o uso da câmera no navegador, ou use a câmera do próprio celular para ler o QR Code.'));
}
function pararLeitor() {
  if (!leitorQR) return;
  const l = leitorQR; leitorQR = null;
  try { l.stop().then(() => l.clear()).catch(() => {}); } catch (e) {}
}

/* ---------- Checklist ---------- */
let respostas = {};
function telaChecklist(cod) {
  const eq = eqPorCodigo(cod);
  if (!eq) return render('Equipamento', `<div class="card"><h2>Código não encontrado</h2><p>${esc(cod)}</p></div><button class="btn" onclick="ir('')">Início</button>`);
  const u = usuario();
  const st = statusEq(eq.Codigo, mesAtual());
  const itens = itensDe(eq), extras = camposExtrasDe(eq);
  respostas = {};
  const outraDupla = duplaDe(eq) && minhaDupla() && duplaDe(eq) !== minhaDupla();
  if (!leituraValida(eq.Codigo)) return telaPrecisaLer(eq, st);
  // valores do cabeçalho (ex.: aquisição da mangueira) do checklist mais recente deste equipamento
  const ultimoComExtras = S.registros.filter(r => r.Codigo === eq.Codigo).sort((a, b) => b.DataHora.localeCompare(a.DataHora))
    .map(detalheDe).find(d => d.extras);
  const anteriores = (ultimoComExtras && ultimoComExtras.extras) || {};
  render(eq.Codigo, `
    ${cartaoEquip(eq, st, true)}
    ${outraDupla ? `<div class="aviso" style="margin:-4px 0 12px">Este equipamento é da dupla ${esc(duplaDe(eq))}. Você pode fazer mesmo assim.</div>` : ''}
    ${extras.length ? `<div class="card"><div class="extras">${extras.map(c => `<div><label for="ex-${c.id}">${esc(c.rotulo)}</label>
      <input type="${c.tipo}" id="ex-${c.id}" value="${esc(anteriores[c.id] || '')}"></div>`).join('')}</div>
      ${Object.keys(anteriores).length ? '<p class="muted" style="margin:8px 0 0;font-size:.82rem">Preenchido com o último checklist. Corrija se mudou.</p>' : ''}</div>` : ''}
    <button class="btn verde" onclick="marcarTodos()">${ico('ok')} Tudo conforme</button>
    <div id="itens">
      ${itens.map((t, i) => `<div class="item" id="it${i}"><p><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(t)}</p>
        <div class="opc"><button class="b-ok" onclick="resp(${i},'ok')">Conforme</button><button class="b-nc" onclick="resp(${i},'nc')">Não conforme</button><button class="b-na" onclick="resp(${i},'na')">N.A.</button></div>
        <input class="obs-item" id="obs${i}" placeholder="Observação deste item" hidden></div>`).join('')}
    </div>
    <div class="card">
      <label class="campo" for="obs" style="margin-top:0">Observações / ações necessárias</label>
      <textarea id="obs" placeholder="Opcional"></textarea>
    </div>
    <button class="btn" style="min-height:64px;font-size:1.1rem" id="btn-salvar" onclick="salvarChecklist('${esc(eq.Codigo)}')">${ico('salvar')} Salvar checklist</button>`);
}
/* Cartão escuro do equipamento: uma informação por linha, sem quebrar (texto longo termina em "…") */
function cartaoEquip(eq, st, completo) {
  const d = duplaDe(eq);
  return `<div class="card escuro ativo-card">
    <div class="topo-eq">
      ${ilus(eq, 56)}
      <div style="flex:1;min-width:0"><div class="cod corta">${esc(eq.Codigo)}</div><div class="muted corta">${esc(nomeTipo(eq))}</div></div>
      ${tagStatus(st)}
    </div>
    <div class="fatos">
      <div>${ico('pin')}<span class="corta">${esc(eq.Local)}${eq.Grupo && eq.Grupo !== eq.Local ? ' · ' + esc(eq.Grupo) : ''}</span></div>
      ${completo ? `<div>${ico('equipe')}<span class="corta">${d ? 'Dupla ' + esc(d) + ' · ' + esc(nomesDupla(d)) : 'Sem dupla'}</span></div>
      <div>${ico('relogio')}<span class="corta">${st.reg ? 'Último: ' + fmtData(st.reg.DataHora) + ' · ' + esc(primeiroNome(st.reg.Brigadista)) : 'Nenhum checklist este mês'}</span></div>` : ''}
    </div>
  </div>`;
}
/* Ilustração grande do equipamento com um selo (ok / nc / x / scan) */
function destaque(eq, selo) {
  const cfg = { ok: ['ok', 'var(--green)'], nc: ['alerta', 'var(--red)'], x: ['x', 'var(--red)'], scan: ['scan', 'var(--amber)'] }[selo];
  return `<span class="destaque">${ilus(eq, 92)}<span class="selo" style="background:${cfg[1]}">${ico(cfg[0])}</span></span>`;
}
/* Sem leitura válida do QR: mostra só as informações e manda ler a etiqueta no local */
function telaPrecisaLer(eq, st) {
  render(eq.Codigo, `
    ${cartaoEquip(eq, st, false)}
    <div class="card ok-msg" style="padding:24px 18px">
      ${destaque(eq, "scan")}
      <h2>Vá até o equipamento</h2>
      <p class="muted" style="margin:0">Para fazer o checklist é obrigatório ler o QR Code da etiqueta, no local.${leitura && leitura.cod === eq.Codigo ? ' A leitura anterior expirou (vale ' + VALIDADE_LEITURA_MIN + ' min).' : ''}</p>
    </div>
    <button class="btn btn-scan" onclick="ir('ler')">${ico('scan')}<span><b>Ler QR Code</b><small>Aponte para a etiqueta do equipamento</small></span></button>`);
}
function resp(i, v) {
  respostas[i] = v;
  document.getElementById('it' + i).className = 'item ' + v;
  const campo = document.getElementById('obs' + i);
  campo.hidden = v === 'ok';                       // como a coluna "N.A. / Observação" do papel
  campo.placeholder = v === 'nc' ? 'O que está errado? (obrigatório)' : 'Observação (opcional)';
  if (v === 'nc') campo.focus();
}
function marcarTodos() {
  document.querySelectorAll('#itens .item').forEach((_, i) => resp(i, 'ok'));
  document.getElementById('btn-salvar').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
async function salvarChecklist(cod) {
  const eq = eqPorCodigo(cod), itens = itensDe(eq), u = usuario();
  const falta = itens.findIndex((_, i) => !respostas[i]);
  if (falta >= 0) { toast('Responda o item ' + (falta + 1)); document.getElementById('it' + falta).scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const obsItens = Object.fromEntries(itens.map((t, i) => [t, respostas[i] === 'ok' ? '' : document.getElementById('obs' + i).value.trim()]).filter(x => x[1]));
  const semObs = itens.findIndex((t, i) => respostas[i] === 'nc' && !obsItens[t]);
  if (semObs >= 0) { toast('Descreva o problema do item ' + (semObs + 1)); document.getElementById('obs' + semObs).focus(); return; }
  const nc = itens.filter((_, i) => respostas[i] === 'nc').map(t => `${t} (${obsItens[t]})`);
  const obs = document.getElementById('obs').value.trim();
  const extras = Object.fromEntries(camposExtrasDe(eq).map(c => [c.id, document.getElementById('ex-' + c.id).value]).filter(x => x[1]));
  if (!leituraValida(eq.Codigo)) { toast('A leitura do QR expirou. Leia a etiqueta de novo.'); return ir('ler'); }
  const btn = document.getElementById('btn-salvar'); btn.disabled = true; btn.textContent = 'Salvando…';
  const agora = new Date();
  const reg = {
    Id: agora.getTime().toString(36) + Math.random().toString(36).slice(2, 7),
    DataHora: agora.toISOString(), Mes: mesDe(agora),
    Codigo: eq.Codigo, Categoria: eq.Categoria, Tipo: eq.Tipo, Local: eq.Local, Dupla: duplaDe(eq), Setor: setorDe(eq),
    Brigadista: u.Nome, Resultado: nc.length ? 'NC' : 'OK', ItensNC: nc.join('; '), Observacao: obs,
    Detalhe: JSON.stringify({ itens: Object.fromEntries(itens.map((t, i) => [t, respostas[i]])), obsItens, extras,
      origem: 'QR', lidoEm: new Date(leitura.em).toISOString(), duplaBrigadista: minhaDupla() }),
    Token: leitura.token, // o banco confere com o código da etiqueta; não é gravado
  };
  leitura = null; // cada leitura vale para um checklist
  const { enviado, recusado } = await salvarRegistro(reg);
  atualizarBanner();
  if (recusado) return render('Recusado', `
    <div class="card ok-msg">
      ${destaque(eq, 'x')}
      <h2>Checklist não aceito</h2>
      <p class="muted" style="margin:0">O QR Code lido não confere com a etiqueta atual de <b>${esc(eq.Codigo)}</b>. A etiqueta pode ter sido trocada. Leia a etiqueta do equipamento de novo ou avise o coordenador.</p>
    </div>
    <button class="btn btn-scan" onclick="ir('ler')">${ico('scan')}<span><b>Ler QR Code</b><small>Tentar de novo</small></span></button>`);
  render('Salvo', `
    <div class="card ok-msg">
      ${destaque(eq, nc.length ? 'nc' : 'ok')}
      <h2>${nc.length ? 'Salvo com não conformidade' : 'Checklist salvo!'}</h2>
      <p style="margin:0"><b>${esc(eq.Codigo)}</b> · ${esc(eq.Local)}</p>
      ${nc.length ? `<p class="muted">Não conformidades: ${esc(nc.join('; '))}</p>` : ''}
      ${!enviado ? '<p class="aviso">Sem internet: ficou salvo no celular e será enviado automaticamente.</p>' : ''}
    </div>
    <button class="btn btn-scan" onclick="ir('ler')">${ico('scan')}<span><b>Próximo equipamento</b><small>Ler outro QR Code</small></span></button>
    <div class="grade2">
      <button class="btn sec" onclick="ir('meus')">${ico('lista')} Meus</button>
      <button class="btn sec" onclick="ir('')">${ico('inicio')} Início</button>
    </div>`);
}

/* ---------- Meus equipamentos ---------- */
function telaMeus() {
  const u = usuario(), mes = mesAtual();
  const ordem = { pend: 0, nc: 1, ok: 2 };
  const meus = equipamentos().filter(e => minhaDupla() && duplaDe(e) === minhaDupla())
    .map(e => ({ e, s: statusEq(e.Codigo, mes) }))
    .sort((a, b) => (ordem[a.s.st] - ordem[b.s.st]) || a.e.Codigo.localeCompare(b.e.Codigo));
  const r = resumo(meus.map(x => x.e), mes);
  // agrupa por setor (localização); setores com pendência aparecem primeiro
  const grupos = setoresDaDupla(minhaDupla()).map(nome => ({ nome, itens: meus.filter(x => setorDe(x.e) === nome) }))
    .filter(g => g.itens.length)
    .sort((a, b) => (b.itens.filter(x => x.s.st === 'pend').length > 0) - (a.itens.filter(x => x.s.st === 'pend').length > 0) || ordenaPt(a.nome, b.nome));
  render('Meus equipamentos', `
    <div class="card">
      <div class="linha" style="justify-content:space-between"><h2 style="margin:0">Dupla ${esc(minhaDupla() || '—')}</h2><span class="muted">${nomeMes(mes)}</span></div>
      <div class="muted" style="margin-top:4px">${grupos.length} setor(es) · ${r.total} equipamentos</div>
      <div class="linha" style="justify-content:space-between;margin:10px 0 6px"><span>${r.feitos} de ${r.total} feitos</span><b>${r.pct}%</b></div>
      <div class="barra"><i style="width:${r.pct}%"></i></div>
    </div>
    ${grupos.map(g => { const rg = resumo(g.itens.map(x => x.e), mes); return `
    <div class="card" style="padding-top:12px;padding-bottom:6px">
      <div class="linha" style="justify-content:space-between;gap:8px"><b style="flex:1;min-width:0">${esc(g.nome)}</b><span class="tag ${rg.pend ? 'pend' : rg.nc ? 'nc' : 'ok'}">${rg.feitos}/${rg.total}</span></div>
      <ul class="lista">${g.itens.map(({ e, s }) => `<li><a class="lin" href="#/eq/${encodeURIComponent(e.Codigo)}">
        ${ilus(e, 46, s.st)}
        <span class="info"><b>${esc(e.Codigo)}</b><small>${esc(nomeTipo(e))}</small></span>${tagStatus(s)}</a></li>`).join('')}</ul>
    </div>`; }).join('')}
    ${meus.length ? '' : '<div class="card"><p class="muted" style="margin:0">Nenhum setor atribuído à sua dupla. Avise o coordenador da brigada.</p></div>'}`);
}

/* ---------- Início do app ---------- */
document.getElementById('btn-voltar').innerHTML = ico('voltar');
document.getElementById('btn-sync').innerHTML = ico('sync');
window.addEventListener('hashchange', rota);
window.addEventListener('online', () => sincronizar());
(async () => {
  await carregar();
  atualizarBanner();
  rota();
  enviarFila().then(atualizarBanner);
})();
</script>
</body>
</html>
